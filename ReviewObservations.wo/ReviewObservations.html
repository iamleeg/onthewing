<!DOCTYPE HTML>
<html>
<head>
    <title>On the Wing: Review Observations</title>
    <webobject name="webFont" />
    <webobject name="styleSheet" />
</head>
<body>
    <webobject name="FirebaseScript" />
    <webobject name="FirebaseAuthUI" />

    <h1>Review Observations</h1>

    <webobject name="hasLocations">
        <h3>Observations Map</h3>
        <webobject name="observationMap" />
    </webobject>

    <table class="responsive-table">
        <thead>
            <tr>
                <th>Time / Date</th>
                <th>Photo</th>
                <th>Bearing</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <webobject name="observationLoop">
                <tr>
                    <td data-label="Time / Date"><webobject name="observationTime"/></td>
                    <td data-label="Photo">
                        <webobject name="photoCapture"/>
                    </td>
                    <td data-label="Bearing">
                        <webobject name="hasBearing">
                            <webobject name="compass" />
                        </webobject>
                        <webobject name="noBearing">
                            No bearing recorded
                        </webobject>
                    </td>
                    <td data-label="Action">
                        <webobject name="deleteLink">Delete</webobject>
                    </td>
                </tr>
            </webobject>
        </tbody>
    </table>

    <webobject name="JournalForm">
    <div class="form-group" style="margin-top: 1em; margin-bottom: 1em;">
        <label>Title</label>
        <webobject name="TitleField" />
    </div>

    <div class="form-group" style="margin-bottom: 1em;">
        <label>Reflections</label>
        <webobject name="ReflectionsField" />
    </div>

    <p>
        <webobject name="SaveToJournalSubmit" />
        <webobject name="discardLink">Discard All</webobject>
        <webobject name="backLink">Return to Main Page</webobject>
    </p>
    </webobject>

    <webobject name="AGPLFooter" />
</body>
</html>
