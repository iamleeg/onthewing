name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (builder stage)
        run: |
          docker build --target builder -t onthewing-builder -f Containerfile .

      - name: Extract Docs
        run: |
          docker create --name temp-builder onthewing-builder
          docker cp temp-builder:/app/DocsOnTheWing ./DocsOnTheWing
          docker rm temp-builder

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./DocsOnTheWing
          publish_branch: gh-pages
