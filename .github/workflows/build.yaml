name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            quay.io/iamleeg/onthewing:latest
            quay.io/iamleeg/onthewing:${{ github.sha }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update deployment manifest
        run: |
          sed -i "s|image: quay.io/iamleeg/onthewing.*|image: quay.io/iamleeg/onthewing:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git add k8s/deployment.yaml
          # Use || true to avoid failing the workflow if there are no changes
          git commit -m "ci: update image tag to ${{ github.sha }} [skip ci]" || true
          git push origin main
