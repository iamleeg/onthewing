apiVersion: batch/v1
kind: Job
metadata:
  name: onthewing-e2e-test
spec:
  template:
    spec:
      containers:
        - name: e2e-test
          image: quay.io/iamleeg/onthewing-e2e
          imagePullPolicy: Never
          env:
            - name: APP_URL
              value: "http://onthewing-svc"
      restartPolicy: Never
  backoffLimit: 0
