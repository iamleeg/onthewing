<div class="auth-container">
    <div class="auth-card">
        <h2 id="auth-title">Sign In</h2>
        
        <div id="auth-error-message" class="auth-error" style="display: none;"></div>

        <!-- Email/Password Login Section -->
        <div id="signin-section">
            <div class="input-group">
                <label for="email-input">Email Address</label>
                <input type="email" id="email-input" placeholder="you@example.com" required />
            </div>
            <div class="input-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="********" required />
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="FirebaseAuth.loginWithEmail(document.getElementById('email-input').value, document.getElementById('password-input').value)">Sign In</button>
            <p class="auth-switch">Don't have an account? <a href="#" onclick="toggleAuthMode(true); return false;">Create one</a></p>
        </div>

        <!-- Registration Section -->
        <div id="register-section" style="display: none;">
            <div class="input-group">
                <label for="reg-name-input">Name</label>
                <input type="text" id="reg-name-input" placeholder="Your Name" />
            </div>
            <div class="input-group">
                <label for="reg-email-input">Email Address</label>
                <input type="email" id="reg-email-input" placeholder="you@example.com" required />
            </div>
            <div class="input-group">
                <label for="reg-password-input">Password</label>
                <input type="password" id="reg-password-input" placeholder="At least 6 characters" required />
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="FirebaseAuth.registerWithEmail(document.getElementById('reg-email-input').value, document.getElementById('reg-password-input').value, document.getElementById('reg-name-input').value)">Register</button>
            <p class="auth-switch">Already have an account? <a href="#" onclick="toggleAuthMode(false); return false;">Sign In</a></p>
        </div>
    </div>

    <!-- Hidden Form for WO Integration -->
    <webobject name="loginForm">
        <webobject name="uidInput" />
        <webobject name="nameInput" />
        <webobject name="emailInput" />
        <webobject name="avatarUrlInput" />
        <webobject name="tokenInput" />
    </webobject>
</div>

<script>
function toggleAuthMode(showRegister) {
    document.getElementById('signin-section').style.display = showRegister ? 'none' : 'block';
    document.getElementById('register-section').style.display = showRegister ? 'block' : 'none';
    document.getElementById('auth-title').textContent = showRegister ? 'Create Account' : 'Sign In';
    FirebaseAuth.clearErrors();
}
</script>
