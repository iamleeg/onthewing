apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: onthewing
build:
  local:
    push: false
  artifacts:
    - image: quay.io/iamleeg/onthewing
      context: .
      custom:
        buildCommand: podman build -t $IMAGE -f Containerfile . && podman save -o /tmp/otw.tar $IMAGE && minikube image load /tmp/otw.tar
        dependencies:
          paths:
            - "**/*"
manifests:
  rawYaml:
    - k8s/deployment.yaml
    - k8s/service.yaml
    - k8s/ingress.yaml
  patches:
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: onthewing-svc
    port: 80
    localPort: 8080
