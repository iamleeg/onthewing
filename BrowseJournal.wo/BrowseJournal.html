<!DOCTYPE HTML>
<html>
<head>
    <title>On the Wing: Browse Journal</title>
    <webobject name="webFont" />
    <webobject name="styleSheet" />
</head>
<body>
    <webobject name="FirebaseScript" />
    <webobject name="FirebaseAuthUI" />
    <webobject name="FlashMessage" />

    <h1>Your Journal</h1>

    <webobject name="noEntries">
        <p>Get out into nature and record what you see!</p>
        <p>
            <webobject name="captureLink">Capture an observation</webobject>
        </p>
    </webobject>

    <webobject name="hasEntries">
        <webobject name="entryLoop">
            <section class="journal-summary" style="margin-bottom: 2em; padding-bottom: 1em; border-bottom: 1px solid #ccc;">
                <h2>
                    <webobject name="viewEntryLink">
                        <webobject name="entryTitle"/>
                    </webobject>
                </h2>
                <div class="summary-meta" style="color: #666; font-size: 0.9em; margin-bottom: 1em;">
                    <webobject name="entryDate"/>
                </div>
                
                <div class="summary-content" style="display: flex; gap: 1em; align-items: flex-start;">
                    <webobject name="hasSummaryPhoto">
                        <div class="summary-photo">
                            <webobject name="summaryPhotoImage"/>
                        </div>
                    </webobject>
                    
                    <div class="summary-text" style="font-style: italic;">
                        <webobject name="reflectionsSnippet"/>
                    </div>
                </div>
            </section>
        </webobject>
    </webobject>

    <p>
        <webobject name="backLink">Return to Main Page</webobject>
    </p>

    <webobject name="AGPLFooter" />
</body>
</html>
