<style>
.user-profile-widget {
    display: inline-flex;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.95rem;
    background: #f8f9fa;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    border: 1px solid #e9ecef;
}
.user-profile-widget a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
}
.user-profile-widget a:hover {
    color: #4338ca;
    text-decoration: underline;
}
.user-profile-widget .divider {
    color: #ced4da;
    margin: 0 0.75rem;
}
.user-profile-widget .logout-link {
    color: #dc3545;
}
.user-profile-widget .logout-link:hover {
    color: #bb2d3b;
}
</style>

<div class="user-profile-widget">
    <webobject name="profileLink">Profile</webobject>
    <span class="divider">|</span>
    <a href="#" onclick="FirebaseAuth.logout(); return false;" class="logout-link">Logout</a>
    
    <webobject name="logoutForm">
    </webobject>
</div>
