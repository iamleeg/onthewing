steps:
  build-and-test-and-push:
    image: woodpeckerci/plugin-kaniko
    settings:
      dockerfile: Containerfile
      registry: quay.io
      repo: iamleeg/onthewing
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: quay_username
      password:
        from_secret: quay_password
    when:
      branch: main
      event: [push, manual]

# Note: The actual tests (`make internal-check`) run automatically 
# during the `builder` stage inside the Containerfile. 
# If the tests fail, the image build fails and the pipeline stops.
