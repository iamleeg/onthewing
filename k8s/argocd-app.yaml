apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onthewing
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s
    repoURL: https://codeberg.org/leeg/onthewing.git
    targetRevision: main
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
