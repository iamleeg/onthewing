apiVersion: apps/v1
kind: Deployment
metadata:
  name: onthewing
  labels:
    app: onthewing
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: onthewing
  template:
    metadata:
      labels:
        app: onthewing
    spec:
      initContainers:
        - name: init-static-assets
          image: quay.io/iamleeg/onthewing:8b847d5e0365075e81985487c975465eb9d12917
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - cp -R /app/OnTheWing.gswa/Resources/WebServer/* /usr/share/nginx/html/
          volumeMounts:
            - name: nginx-static-vol
              mountPath: /usr/share/nginx/html
      containers:
        - name: onthewing
          image: quay.io/iamleeg/onthewing:8b847d5e0365075e81985487c975465eb9d12917
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "onthewing-eedce-database"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: GCS_BUCKET
              value: "onthewing-eedce.firebasestorage.app"
            - name: GCS_SERVICE_ACCOUNT_KEY_PATH
              value: "/secrets/gcs/key.json"
            - name: REDIS_HOST
              value: "redis-master"
          volumeMounts:
            - name: gcs-storage-credentials-vol
              mountPath: /secrets/gcs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /WebObjects/OnTheWing.woa?wa=ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /WebObjects/OnTheWing.woa?wa=ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 120
        - name: nginx-sidecar
          image: nginx:alpine
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: nginx-static-vol
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config-vol
              mountPath: /etc/nginx/conf.d
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--credentials-file=/secrets/gcp/key.json"
            - "onthewing-eedce:europe-west2:onthewing-eedce-instance"
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - name: gcp-credentials-vol
              mountPath: /secrets/gcp
              readOnly: true
      volumes:
        - name: gcp-credentials-vol
          secret:
            secretName: gcp-credentials
        - name: gcs-storage-credentials-vol
          secret:
            secretName: gcs-storage-credentials
        - name: nginx-static-vol
          emptyDir: {}
        - name: nginx-config-vol
          configMap:
            name: onthewing-nginx-config
