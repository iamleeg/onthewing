apiVersion: apps/v1
kind: Deployment
metadata:
  name: onthewing
  labels:
    app: onthewing
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: onthewing
  template:
    metadata:
      labels:
        app: onthewing
    spec:
      containers:
        - name: onthewing
          image: quay.io/iamleeg/onthewing:61e84b5f2532e4cca931950adb95813fd8a5bbfd
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "onthewing-eedce-database"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /WebObjects/OnTheWing.woa
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /WebObjects/OnTheWing.woa
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--credentials-file=/secrets/gcp/key.json"
            - "onthewing-eedce:europe-west2:onthewing-eedce-instance"
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - name: gcp-credentials-vol
              mountPath: /secrets/gcp
              readOnly: true
      volumes:
        - name: gcp-credentials-vol
          secret:
            secretName: gcp-credentials

