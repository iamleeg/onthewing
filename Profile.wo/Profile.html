<!DOCTYPE HTML>
<html>

<head>
    <title>On the Wing: User Profile</title>
</head>

<body>
    <webobject name="FirebaseScript" />
    
    <style>
    .profile-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 3rem 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .profile-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 450px;
        padding: 2.5rem;
        box-sizing: border-box;
        border: 1px solid #eaeaea;
        text-align: center;
    }
    .profile-avatar-container {
        margin-bottom: 1.5rem;
    }
    .profile-avatar-container img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #4f46e5;
        box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
    }
    .profile-card h2 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        color: #1a1a1a;
        font-size: 1.5rem;
        font-weight: 600;
    }
    .profile-details {
        margin-bottom: 2rem;
        border-top: 1px solid #eaeaea;
        border-bottom: 1px solid #eaeaea;
        padding: 1rem 0;
    }
    .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 0.75rem 0;
    }
    .detail-label {
        font-weight: 500;
        color: #666666;
        font-size: 0.95rem;
    }
    .detail-value {
        color: #1a1a1a;
        font-weight: 600;
        font-size: 0.95rem;
    }
    .btn-secondary {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #4b5563;
        background-color: #f3f4f6;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s, color 0.2s;
        border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover {
        background-color: #e5e7eb;
        color: #1f2937;
    }
    </style>
    
    <div class="profile-container">
        <div class="profile-card">
            <webobject name="hasAvatar">
                <div class="profile-avatar-container">
                    <webobject name="avatarImage" />
                </div>
            </webobject>
            
            <h2>User Profile</h2>
            
            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Name</span>
                    <span class="detail-value"><webobject name="userName" /></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email</span>
                    <span class="detail-value"><webobject name="userEmail" /></span>
                </div>
            </div>
            
            <webobject name="backLink">Back to Journal</webobject>
        </div>
    </div>
    
    <webobject name="AGPLFooter" />
</body>

</html>
