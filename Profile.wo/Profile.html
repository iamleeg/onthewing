<!DOCTYPE HTML>
<html>

<head>
    <title>On the Wing: User Profile</title>
    <webobject name="webFont" />
    <webobject name="styleSheet" />
</head>

<body>
    <webobject name="FirebaseScript" />
    <webobject name="FlashMessage" />

    <div class="profile-container">
        <div class="profile-card">
            <webobject name="hasAvatar">
                <div class="profile-avatar-container">
                    <webobject name="avatarImage" />
                </div>
            </webobject>
            
            <h2>User Profile</h2>
            
            <webobject name="profileForm">
                <div class="profile-details">
                    <div class="input-group">
                        <label for="profile-name">Name</label>
                        <webobject name="nameInput" />
                    </div>
                    <div class="input-group">
                        <label for="profile-email">Email</label>
                        <webobject name="emailInput" />
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem;">
                    <webobject name="updateButton">Update Profile</webobject>
                    <webobject name="backLink">Back to Journal</webobject>
                </div>
            </webobject>

            <div style="margin-top: 2rem; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
                <p style="color: var(--color-text-muted); font-size: 0.875rem; margin-bottom: 1rem; text-align: left;">
                    Warning: Deleting your account will permanently remove all your data from our database and Firebase.
                </p>
                <a href="#" class="btn btn-danger" style="width: 100%; text-align: center;" onclick="deleteUserAccount(); return false;">Delete Account</a>
            </div>

            <!-- Hidden Form for Delete Account WO Integration -->
            <webobject name="deleteForm">
            </webobject>
        </div>
    </div>
    
    <webobject name="AGPLFooter" />

    <script>
    async function deleteUserAccount() {
        if (confirm("Are you sure you want to delete your account? This action is permanent and cannot be undone.")) {
            try {
                if (typeof firebase !== 'undefined') {
                    const user = firebase.auth().currentUser;
                    if (user) {
                        await user.delete();
                    }
                }
            } catch (error) {
                console.error("Firebase Auth user deletion failed/ignored:", error);
                alert("Firebase deletion failed: " + error.message + "\nProceeding with database deletion.");
            }
            // Submit the database deletion form
            document.getElementById('delete-account-form').submit();
        }
    }
    </script>
</body>

</html>
